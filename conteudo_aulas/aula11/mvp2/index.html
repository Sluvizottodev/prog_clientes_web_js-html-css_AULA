<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV</title>
</head>
<body>
    <label for="codigo">Código:</label>
    <input type="text" id="codigo">
    <button id="adicionar">Adicionar</button>
    <div id="produto"></div>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Descrição</th>
                <th>Preço (R$)</th>
                <th>Qtd.</th>
                <th>Subtotal (R$)</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr>
                <td colspan="4"></td>
                <td id="total" >R$ 0,00</td>
            </tr>
        </tfoot>
    </table>
    <script type="module">
        import { VisaoPDV } from './src/visao-pdv.js';
        const visao = new VisaoPDV();
        visao.iniciar();
    </script>
</body>
</html>
