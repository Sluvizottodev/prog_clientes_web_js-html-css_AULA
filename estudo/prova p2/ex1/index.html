<script src="./index.js" type="module" defer ></script>
<h1>Cadastro de Estado</h1>
<form>
  <label for="nome">Nome:</label>
  <input type="text" name="nome" id="nome" minlength="2" maxlength="60" required />
  <label for="uf">UF:</label>
  <input type="text" name="uf" id="uf" minlength="2" maxlength="2" required />
  <label for="pais">País:</label>
  <select name="pais" id="pais" required ></select>
  <span hidden ><img alt="bandeira" src="bandeira" /></span>
  <button>Salvar</button>
  <output></output>
</form>
